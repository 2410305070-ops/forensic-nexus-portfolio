<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Create a DNA Helix representation using spheres and lines
const helixGroup = new THREE.Group();
const curve = new THREE.CatmullRomCurve3([]);
const points = 50;
const radius = 2;
const heightStep = 0.4;

for (let i = 0; i < points; i++) {
    const angle = i * 0.5;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const y = (i - points / 2) * heightStep;

    // Strand 1
    const sphere1 = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x007bff })
    );
    sphere1.position.set(x, y, z);
    helixGroup.add(sphere1);

    // Strand 2
    const sphere2 = new THREE.Mesh(
        new THREE.SphereGeometry(0.1, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0x00d2ff })
    );
    sphere2.position.set(-x, y, -z);
    helixGroup.add(sphere2);

    // Connector
    if (i % 2 === 0) {
        const lineGeom = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x, y, z),
            new THREE.Vector3(-x, y, -z)
        ]);
        const line = new THREE.Line(
            lineGeom,
            new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.5 })
        );
        helixGroup.add(line);
    }
}

scene.add(helixGroup);
camera.position.z = 12;

function animate() {
    requestAnimationFrame(animate);
    helixGroup.rotation.y += 0.01;
    helixGroup.rotation.x += 0.005;
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->
</body>
</html>
